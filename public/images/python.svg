<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="A code editor window with a friendly python snake">
  <defs>
    <linearGradient id="pyBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#FBEFD0"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" rx="28" fill="url(#pyBg)"/>
  <circle cx="58" cy="290" r="42" fill="#C5F1ED" opacity=".7"/>
  <circle cx="422" cy="70" r="36" fill="#FFD4D4" opacity=".65"/>

  <!-- editor -->
  <g transform="translate(228 168)">
    <rect x="-160" y="-116" width="320" height="216" rx="20" fill="#1E293B"/>
    <rect x="-160" y="-116" width="320" height="34" rx="20" fill="#334155"/>
    <rect x="-160" y="-96" width="320" height="14" fill="#334155"/>
    <circle cx="-136" cy="-99" r="6" fill="#FF6B6B"/><circle cx="-118" cy="-99" r="6" fill="#FFC93C"/><circle cx="-100" cy="-99" r="6" fill="#4ECDC4"/>
    <g font-family="Consolas, Menlo, monospace" font-size="17">
      <text x="-138" y="-46" fill="#FFC93C">def</text>
      <text x="-96" y="-46" fill="#C5F1ED">greet(name):</text>
      <text x="-116" y="-16" fill="#FFD4D4">print(</text>
      <text x="-56" y="-16" fill="#FFC93C">"Hi "</text>
      <text x="-6" y="-16" fill="#FFF8E7">+ name)</text>
      <text x="-138" y="18" fill="#C5F1ED">greet(</text>
      <text x="-80" y="18" fill="#FFC93C">"Brolly"</text>
      <text x="0" y="18" fill="#C5F1ED">)</text>
      <text x="-138" y="56" fill="#C5F1ED">&gt;&gt;&gt; Hi Brolly</text>
    </g>
    <rect x="-138" y="70" width="12" height="20" fill="#FFC93C"/>
  </g>

  <!-- snake -->
  <g transform="translate(370 262)">
    <path d="M-84 40c0-30 24-40 44-40s34-8 34-24-12-24-30-24-30 10-30 24" fill="none" stroke="#4ECDC4" stroke-width="24" stroke-linecap="round"/>
    <path d="M-84 40c0-30 24-40 44-40" fill="none" stroke="#FFC93C" stroke-width="24" stroke-linecap="round"/>
    <circle cx="-36" cy="-24" r="22" fill="#4ECDC4"/>
    <circle cx="-44" cy="-30" r="5" fill="#FFF8E7"/><circle cx="-28" cy="-30" r="5" fill="#FFF8E7"/>
    <circle cx="-44" cy="-30" r="2.4" fill="#1E293B"/><circle cx="-28" cy="-30" r="2.4" fill="#1E293B"/>
    <path d="M-36 -6l-4 12 8-4Z" fill="#FF6B6B"/>
  </g>

  <!-- bug badge -->
  <g transform="translate(70 92)">
    <circle cx="0" cy="0" r="30" fill="#FFFFFF" stroke="#E2D9BD" stroke-width="3"/>
    <ellipse cx="0" cy="2" rx="12" ry="15" fill="#FF6B6B"/>
    <path d="M-12 -6l-10-8M12 -6l10-8M-14 2h-12M14 2h12M-12 10l-10 10M12 10l10 10" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-13" r="6" fill="#1E293B"/>
  </g>
</svg>
