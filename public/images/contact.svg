<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="A phone, chat bubbles and a location pin for getting in touch">
  <defs>
    <linearGradient id="coBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#FBEFD0"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" rx="28" fill="url(#coBg)"/>
  <circle cx="60" cy="288" r="42" fill="#C5F1ED" opacity=".65"/>
  <circle cx="420" cy="76" r="36" fill="#FFD4D4" opacity=".6"/>

  <!-- phone -->
  <g transform="translate(168 184)">
    <rect x="-72" y="-124" width="144" height="248" rx="26" fill="#1E293B"/>
    <rect x="-60" y="-108" width="120" height="216" rx="16" fill="#FFF8E7"/>
    <rect x="-20" y="-118" width="40" height="8" rx="4" fill="#334155"/>
    <circle cx="0" cy="116" r="0" fill="none"/>
    <!-- chat bubbles on screen -->
    <rect x="-48" y="-88" width="76" height="30" rx="14" fill="#FBEFD0"/>
    <rect x="-12" y="-48" width="70" height="30" rx="14" fill="#C5F1ED"/>
    <rect x="-48" y="-8" width="86" height="30" rx="14" fill="#FBEFD0"/>
    <rect x="-12" y="32" width="70" height="30" rx="14" fill="#C5F1ED"/>
    <rect x="-48" y="72" width="52" height="26" rx="13" fill="#FFE9A3"/>
  </g>

  <!-- big chat bubble -->
  <g transform="translate(330 130)">
    <rect x="-84" y="-72" width="168" height="118" rx="26" fill="#FFFFFF" stroke="#E2D9BD" stroke-width="5"/>
    <path d="M-46 46l-10 30 40-30Z" fill="#FFFFFF" stroke="#E2D9BD" stroke-width="5"/>
    <g fill="#FFC93C"><circle cx="-34" cy="-12" r="9"/><circle cx="0" cy="-12" r="9"/><circle cx="34" cy="-12" r="9"/></g>
    <rect x="-58" y="-48" width="80" height="12" rx="6" fill="#FBEFD0"/>
  </g>

  <!-- location pin -->
  <g transform="translate(356 268)">
    <path d="M0-56c24 0 42 18 42 40 0 30-42 62-42 62s-42-32-42-62c0-22 18-40 42-40Z" fill="#FF6B6B" stroke="#1E293B" stroke-width="5"/>
    <circle cx="0" cy="-16" r="16" fill="#FFF8E7"/>
  </g>

  <!-- envelope -->
  <g transform="translate(72 132)">
    <rect x="-46" y="-32" width="92" height="66" rx="12" fill="#FFFFFF" stroke="#4ECDC4" stroke-width="5"/>
    <path d="M-46 -24 0 8l46-32" fill="none" stroke="#4ECDC4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
