<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="A friendly AI robot with a chat window and idea sparks">
  <defs>
    <linearGradient id="aiBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#FBEFD0"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" rx="28" fill="url(#aiBg)"/>
  <circle cx="60" cy="66" r="40" fill="#C5F1ED" opacity=".7"/>
  <circle cx="424" cy="284" r="44" fill="#FFE9A3" opacity=".8"/>

  <!-- robot -->
  <g transform="translate(168 186)">
    <path d="M0-136v22" stroke="#4ECDC4" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="-142" r="10" fill="#FFC93C"/>
    <rect x="-84" y="-114" width="168" height="140" rx="34" fill="#FFFFFF" stroke="#4ECDC4" stroke-width="6"/>
    <rect x="-62" y="-92" width="124" height="80" rx="24" fill="#4ECDC4"/>
    <circle cx="-26" cy="-56" r="13" fill="#FFC93C"/><circle cx="26" cy="-56" r="13" fill="#FFC93C"/>
    <circle cx="-22" cy="-58" r="5" fill="#1E293B"/><circle cx="30" cy="-58" r="5" fill="#1E293B"/>
    <path d="M-20 -22c12 10 28 10 40 0" stroke="#C5F1ED" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="-52" cy="4" r="6" fill="#FF6B6B"/><circle cx="52" cy="4" r="6" fill="#FFC93C"/>
    <!-- body -->
    <rect x="-64" y="34" width="128" height="88" rx="26" fill="#FFFFFF" stroke="#4ECDC4" stroke-width="6"/>
    <rect x="-36" y="58" width="72" height="40" rx="12" fill="#FBEFD0"/>
    <path d="M-22 78h44M-22 66h30" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
    <path d="M-64 62h-24c-10 0-16 8-16 18v18" fill="none" stroke="#4ECDC4" stroke-width="6" stroke-linecap="round"/>
    <path d="M64 62h24c10 0 16 8 16 18v18" fill="none" stroke="#4ECDC4" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-104" cy="104" r="11" fill="#FF6B6B"/><circle cx="104" cy="104" r="11" fill="#FFC93C"/>
  </g>

  <!-- chat window -->
  <g transform="translate(348 132)">
    <rect x="-78" y="-84" width="156" height="132" rx="22" fill="#FFFFFF" stroke="#E2D9BD" stroke-width="4"/>
    <path d="M-44 48l-8 30 38-30Z" fill="#FFFFFF" stroke="#E2D9BD" stroke-width="4"/>
    <rect x="-56" y="-60" width="112" height="16" rx="8" fill="#FBEFD0"/>
    <rect x="-56" y="-34" width="86" height="16" rx="8" fill="#C5F1ED"/>
    <rect x="-56" y="-8" width="112" height="16" rx="8" fill="#FBEFD0"/>
    <rect x="-56" y="18" width="64" height="16" rx="8" fill="#FFE9A3"/>
  </g>

  <!-- idea spark -->
  <g transform="translate(392 264)">
    <path d="M0-30c16 0 28 12 28 26 0 10-6 16-10 22-2 4-2 8-2 12h-32c0-4 0-8-2-12-4-6-10-12-10-22 0-14 12-26 28-26Z" fill="#FFC93C" stroke="#1E293B" stroke-width="4"/>
    <path d="M-14 36h28M-10 46h20" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- nodes -->
  <g stroke="#4ECDC4" stroke-width="3" opacity=".55" fill="none">
    <path d="M62 292c30-22 62-10 86-34"/>
  </g>
  <circle cx="62" cy="292" r="8" fill="#4ECDC4" opacity=".55"/>
  <circle cx="112" cy="284" r="6" fill="#FF6B6B" opacity=".7"/>
</svg>
