<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="A teacher and small group of children in a warm classroom">
  <defs>
    <linearGradient id="abtBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#FBEFD0"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" rx="28" fill="url(#abtBg)"/>
  <circle cx="66" cy="70" r="40" fill="#FFE9A3" opacity=".8"/>
  <circle cx="424" cy="88" r="30" fill="#C5F1ED" opacity=".6"/>

  <!-- board -->
  <rect x="118" y="44" width="246" height="128" rx="14" fill="#4ECDC4" stroke="#1E293B" stroke-width="6"/>
  <text x="241" y="104" font-family="Fredoka, Poppins, sans-serif" font-weight="700" font-size="26" text-anchor="middle" fill="#FFF8E7">Where curiosity</text>
  <text x="241" y="140" font-family="Fredoka, Poppins, sans-serif" font-weight="700" font-size="26" text-anchor="middle" fill="#FFC93C">finds shelter</text>

  <!-- umbrella motif -->
  <g transform="translate(410 196)">
    <path d="M-44 0c2-28 22-44 44-44S42-28 44 0c-8-6-14 4-22 0s-14 8-22 0-14 6-22 0Z" fill="#FF6B6B"/>
