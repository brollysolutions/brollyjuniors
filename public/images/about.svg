    <path d="M0 0v34c0 8-6 12-12 12s-10-4-10-9" fill="none" stroke="#B07642" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- teacher -->
  <g transform="translate(112 236)">
    <path d="M-38 92c0-46 18-72 38-72s38 26 38 72Z" fill="#FFC93C"/>
    <circle cx="0" cy="-8" r="30" fill="#EBB183"/>
    <path d="M-30 -12c0-20 14-32 30-32s30 12 30 32c-6-6-14-24-30-14s-24 8-30 14Z" fill="#2B1D12"/>
    <circle cx="-10" cy="-6" r="3.6" fill="#1E293B"/><circle cx="10" cy="-6" r="3.6" fill="#1E293B"/>
    <path d="M-8 6c5 6 11 6 16 0" stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M34 40c22-4 34-20 36-40" fill="none" stroke="#EBB183" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- children row -->
  <g>
    <g transform="translate(238 268)">
      <path d="M-32 60c0-32 14-52 32-52s32 20 32 52Z" fill="#4ECDC4"/>
      <circle cx="0" cy="-14" r="22" fill="#F6C89A"/>
      <path d="M-22 -16c0-15 10-26 22-26s22 11 22 26c-6-8-13-12-22-12s-16 4-22 12Z" fill="#3B2E22"/>
      <circle cx="-8" cy="-12" r="3" fill="#1E293B"/><circle cx="8" cy="-12" r="3" fill="#1E293B"/>
    </g>
    <g transform="translate(324 276)">
      <path d="M-30 52c0-30 13-48 30-48s30 18 30 48Z" fill="#FF6B6B"/>
      <circle cx="0" cy="-14" r="21" fill="#C98B5E"/>
