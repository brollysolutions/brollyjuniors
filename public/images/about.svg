    <circle cx="0" cy="0" r="28" fill="#FFFFFF" stroke="#E2D9BD" stroke-width="3"/>
    <path d="M0 12c-14-9-20-15-20-23a10 10 0 0 1 20-4 10 10 0 0 1 20 4c0 8-6 14-20 23Z" fill="#FF6B6B"/>
