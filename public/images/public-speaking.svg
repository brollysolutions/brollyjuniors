<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="A child speaking confidently at a microphone with a friendly audience">
  <defs>
    <linearGradient id="psBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#FBEFD0"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" rx="28" fill="url(#psBg)"/>
  <circle cx="64" cy="70" r="42" fill="#FFE9A3" opacity=".8"/>
  <circle cx="418" cy="96" r="32" fill="#C5F1ED" opacity=".7"/>

  <!-- stage spotlight -->
  <path d="M240 20 118 300h244Z" fill="#FFC93C" opacity=".35"/>

  <!-- speaker child -->
  <g transform="translate(240 0)">
    <path d="M-52 300c0-44 24-70 52-70s52 26 52 70Z" fill="#4ECDC4"/>
    <path d="M-52 300c0-44 24-70 52-70v70Z" fill="#1E293B" opacity=".35"/>
    <circle cx="0" cy="196" r="38" fill="#EBB183"/>
    <path d="M-38 192c0-24 17-40 38-40s38 16 38 40c-9-14-22-20-38-20s-29 6-38 20Z" fill="#2B1D12"/>
    <circle cx="-13" cy="196" r="4.2" fill="#1E293B"/><circle cx="13" cy="196" r="4.2" fill="#1E293B"/>
    <path d="M-11 212c7 9 15 9 22 0" stroke="#1E293B" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <!-- raised arm -->
    <path d="M44 250c22-6 34-24 34-46" fill="none" stroke="#EBB183" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- microphone -->
  <g transform="translate(150 224)">
    <rect x="-14" y="-46" width="28" height="52" rx="14" fill="#1E293B"/>
    <path d="M-24 -4c0 18 11 28 24 28s24-10 24-28" fill="none" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
    <path d="M0 24v22" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
    <rect x="-26" y="46" width="52" height="10" rx="5" fill="#1E293B"/>
    <path d="M-38 -34c-10 12-10 34 0 46M-52 -46c-16 18-16 62 0 80" fill="none" stroke="#FF6B6B" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- audience -->
  <g>
    <g transform="translate(74 306)">
      <path d="M-30 42c0-24 13-40 30-40s30 16 30 40Z" fill="#FF6B6B"/>
      <circle cx="0" cy="-10" r="20" fill="#F6C89A"/>
      <path d="M-20 -12c0-14 9-24 20-24s20 10 20 24c-5-8-12-11-20-11s-15 3-20 11Z" fill="#3B2E22"/>
    </g>
    <g transform="translate(406 306)">
      <path d="M-30 42c0-24 13-40 30-40s30 16 30 40Z" fill="#FFC93C"/>
      <circle cx="0" cy="-10" r="20" fill="#C98B5E"/>
      <path d="M-20 -12c1-14 10-24 20-24s19 10 20 24c-5-8-12-11-20-11s-15 3-20 11Z" fill="#20160F"/>
    </g>
  </g>

  <!-- applause + speech bubbles -->
  <g>
    <rect x="298" y="94" width="118" height="58" rx="24" fill="#FFFFFF" stroke="#E2D9BD" stroke-width="3"/>
    <path d="M320 152l-6 20 24-20Z" fill="#FFFFFF" stroke="#E2D9BD" stroke-width="3"/>
    <g fill="#1E293B">
      <circle cx="332" cy="123" r="7"/><circle cx="357" cy="123" r="7"/><circle cx="382" cy="123" r="7"/>
    </g>
    <g font-family="Fredoka, Poppins, sans-serif" font-weight="700" font-size="26" text-anchor="middle">
      <circle cx="66" cy="176" r="30" fill="#FFFFFF" stroke="#E2D9BD" stroke-width="3"/>
      <text x="66" y="186" fill="#4ECDC4">★</text>
    </g>
  </g>
</svg>
