<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="A free trial class ticket with a happy child and calendar">
  <defs>
    <linearGradient id="ftBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#FBEFD0"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" rx="28" fill="url(#ftBg)"/>
  <circle cx="64" cy="80" r="42" fill="#FFD4D4" opacity=".6"/>
  <circle cx="418" cy="284" r="42" fill="#C5F1ED" opacity=".6"/>

  <!-- ticket -->
  <g transform="translate(240 152) rotate(-5)">
    <path d="M-160-62h320v40a22 22 0 0 0 0 44v40h-320v-40a22 22 0 0 0 0-44Z" fill="#FFC93C" stroke="#1E293B" stroke-width="6"/>
    <path d="M64-62v124" stroke="#FFF8E7" stroke-width="5" stroke-dasharray="10 12"/>
    <text x="-46" y="-4" font-family="Fredoka, Poppins, sans-serif" font-weight="700" font-size="34" text-anchor="middle" fill="#FFF8E7">FREE TRIAL</text>
    <text x="-46" y="28" font-family="Poppins, sans-serif" font-weight="700" font-size="17" text-anchor="middle" fill="#FBEFD0">One class · No payment</text>
    <g transform="translate(112 0)">
      <circle cx="0" cy="-14" r="24" fill="#FFF8E7"/>
      <path d="M-11 -14 -3 -6 12 -24" fill="none" stroke="#4ECDC4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="30" font-family="Poppins, sans-serif" font-weight="700" font-size="14" text-anchor="middle" fill="#FFF8E7">BOOKED</text>
    </g>
  </g>

  <!-- happy child -->
  <g transform="translate(140 288)">
    <path d="M-40 62c0-40 18-64 40-64s40 24 40 64Z" fill="#4ECDC4"/>
    <circle cx="0" cy="-24" r="28" fill="#EBB183"/>
    <path d="M-28 -26c0-18 13-30 28-30s28 12 28 30c-7-8-16-12-28-12s-21 4-28 12Z" fill="#2B1D12"/>
    <circle cx="-10" cy="-22" r="3.6" fill="#1E293B"/><circle cx="10" cy="-22" r="3.6" fill="#1E293B"/>
    <path d="M-10 -10c6 8 14 8 20 0" stroke="#1E293B" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M36 12c22-8 32-26 30-48" fill="none" stroke="#EBB183" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- calendar -->
  <g transform="translate(360 288)">
    <rect x="-48" y="-46" width="96" height="92" rx="14" fill="#FFFFFF" stroke="#E2D9BD" stroke-width="5"/>
    <rect x="-48" y="-46" width="96" height="28" rx="14" fill="#FF6B6B"/>
    <rect x="-48" y="-32" width="96" height="14" fill="#FF6B6B"/>
    <path d="M-26 -54v14M26 -54v14" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
    <text x="0" y="24" font-family="Fredoka, Poppins, sans-serif" font-weight="700" font-size="32" text-anchor="middle" fill="#1E293B">1</text>
  </g>

  <!-- confetti -->
  <g>
    <rect x="70" y="150" width="14" height="14" rx="4" fill="#FF6B6B" transform="rotate(20 77 157)"/>
    <rect x="396" y="164" width="14" height="14" rx="4" fill="#4ECDC4" transform="rotate(-16 403 171)"/>
    <circle cx="248" cy="270" r="7" fill="#1E293B"/>
    <circle cx="286" cy="238" r="5" fill="#4ECDC4"/>
  </g>
</svg>
