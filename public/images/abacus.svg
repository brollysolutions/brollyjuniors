<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="A wooden soroban abacus with colourful beads">
  <defs>
    <linearGradient id="abBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#FBEFD0"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" rx="28" fill="url(#abBg)"/>
  <circle cx="58" cy="62" r="38" fill="#C5F1ED" opacity=".7"/>
  <circle cx="426" cy="298" r="42" fill="#FFD4D4" opacity=".6"/>

  <!-- frame -->
  <rect x="62" y="58" width="356" height="244" rx="20" fill="#C98B5E" stroke="#8B5E34" stroke-width="6"/>
  <rect x="88" y="84" width="304" height="192" rx="10" fill="#FFF8E7"/>
  <rect x="88" y="146" width="304" height="12" rx="6" fill="#8B5E34"/>

  <!-- rods -->
  <g stroke="#B07642" stroke-width="5" stroke-linecap="round">
    <path d="M126 92v176"/><path d="M170 92v176"/><path d="M214 92v176"/>
    <path d="M258 92v176"/><path d="M302 92v176"/><path d="M346 92v176"/>
  </g>

