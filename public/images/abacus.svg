  <!-- counting hand -->
  <g transform="translate(376 236)">
    <path d="M0 60c-8-22-2-44 12-52 6-4 12 0 11 8l-3 18 6-38c1-8 14-8 14 1l-1 34 5-36c1-9 14-8 14 1l-2 36 6-26c2-8 14-6 13 3l-4 44c-2 20-14 32-32 32-16 0-33-9-39-25Z" fill="#F6C89A" stroke="#D9A272" stroke-width="3" stroke-linejoin="round"/>
