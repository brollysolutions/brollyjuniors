    <ellipse cx="302" cy="112" rx="17" ry="12" fill="#FFC93C" stroke="#1E293B" stroke-width="3"/>
    <ellipse cx="346" cy="134" rx="17" ry="12" fill="#FFC93C" stroke="#1E293B" stroke-width="3"/>
  </g>

