<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Young learners with letters, numbers, art and a microphone">
  <defs>
    <linearGradient id="jsBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#FBEFD0"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" rx="28" fill="url(#jsBg)"/>
  <circle cx="60" cy="66" r="38" fill="#FFE9A3" opacity=".8"/>
  <circle cx="424" cy="272" r="44" fill="#C5F1ED" opacity=".6"/>

  <!-- growth arc -->
  <path d="M52 288c60-96 140-140 244-152" fill="none" stroke="#E2D9BD" stroke-width="10" stroke-linecap="round" stroke-dasharray="4 22"/>

  <!-- skill tiles -->
  <g font-family="Fredoka, Poppins, sans-serif" font-weight="700" text-anchor="middle">
    <g transform="rotate(-7 96 216)">
      <rect x="56" y="176" width="80" height="80" rx="18" fill="#FFC93C" stroke="#1E293B" stroke-width="5"/>
      <text x="96" y="230" font-size="40" fill="#FFF8E7">Aa</text>
    </g>
    <g transform="rotate(6 190 178)">
      <rect x="150" y="138" width="80" height="80" rx="18" fill="#4ECDC4" stroke="#1E293B" stroke-width="5"/>
      <text x="190" y="192" font-size="38" fill="#C5F1ED">123</text>
    </g>
    <g transform="rotate(-5 286 148)">
      <rect x="246" y="108" width="80" height="80" rx="18" fill="#FF6B6B" stroke="#1E293B" stroke-width="5"/>
      <g transform="translate(286 148)">
        <rect x="-9" y="-32" width="18" height="34" rx="9" fill="#FFF8E7"/>
        <path d="M-17 -4c0 12 8 19 17 19s17-7 17-19" fill="none" stroke="#FFF8E7" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M0 15v13" stroke="#FFF8E7" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M-13 30h26" stroke="#FFF8E7" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- painter child -->
  <g transform="translate(340 250)">
    <path d="M-40 84c0-44 18-70 40-70s40 26 40 70Z" fill="#FFC93C"/>
    <circle cx="0" cy="-16" r="30" fill="#EBB183"/>
    <path d="M-30 -20c0-19 14-32 30-32s30 13 30 32c-7-9-17-13-30-13s-23 4-30 13Z" fill="#2B1D12"/>
    <circle cx="-11" cy="-14" r="3.8" fill="#1E293B"/><circle cx="11" cy="-14" r="3.8" fill="#1E293B"/>
    <path d="M-9 0c6 7 12 7 18 0" stroke="#1E293B" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <!-- palette -->
    <g transform="translate(-58 34)">
      <path d="M0-24c18 0 32 12 32 26 0 10-10 10-14 16-4 5 0 12-8 12-16 0-30-12-30-27S-16-24 0-24Z" fill="#FFFFFF" stroke="#E2D9BD" stroke-width="4"/>
      <circle cx="-6" cy="-8" r="5" fill="#FF6B6B"/><circle cx="10" cy="0" r="5" fill="#4ECDC4"/><circle cx="-10" cy="8" r="5" fill="#FFC93C"/>
    </g>
  </g>

  <!-- pencil -->
  <g transform="translate(94 96) rotate(-30)">
    <rect x="-10" y="-42" width="20" height="70" rx="5" fill="#FFC93C" stroke="#1E293B" stroke-width="4"/>
    <path d="M-10 28 0 50l10-22Z" fill="#B07642"/>
    <path d="M-3 44 0 50l3-6Z" fill="#1E293B"/>
    <rect x="-10" y="-46" width="20" height="10" rx="4" fill="#FF6B6B"/>
  </g>

  <!-- star -->
  <g transform="translate(432 132)">
    <path d="M0-24 7-8l17 2-13 12 4 17L0 15l-15 8 4-17-13-12 17-2Z" fill="#FFC93C"/>
  </g>
