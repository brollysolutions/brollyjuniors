  <!-- floating skill badges -->
  <g font-family="Poppins, sans-serif" font-weight="700" font-size="20" text-anchor="middle">
    <circle cx="62" cy="212" r="25" fill="#FFFFFF" stroke="#E2D9BD" stroke-width="2"/>
    <text x="62" y="220" fill="#1E293B">Aa</text>
    <circle cx="424" cy="212" r="25" fill="#FFFFFF" stroke="#E2D9BD" stroke-width="2"/>
    <text x="424" y="220" fill="#4ECDC4">123</text>
    <circle cx="92" cy="120" r="21" fill="#FFFFFF" stroke="#E2D9BD" stroke-width="2"/>
    <text x="92" y="128" fill="#FF6B6B" font-size="17">&lt;/&gt;</text>
