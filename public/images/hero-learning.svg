<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-label="Children learning together under a big colourful umbrella">
  <defs>
    <linearGradient id="hlSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="1" stop-color="#FBEFD0"/>
    </linearGradient>
    <clipPath id="hlCanopy">
      <path d="M52 158C66 74 142 38 240 38s174 36 188 120c-24 14-40-10-64-4s-32 22-60 12-36 8-64 0-36 18-60 4-32 12-56-2-48 4-72-10Z"/>
    </clipPath>
  </defs>

  <rect width="480" height="400" rx="30" fill="url(#hlSky)"/>
  <circle cx="70" cy="70" r="46" fill="#FFE9A3" opacity=".7"/>
  <circle cx="418" cy="118" r="34" fill="#C5F1ED" opacity=".7"/>
  <circle cx="404" cy="316" r="52" fill="#FFD4D4" opacity=".55"/>

  <!-- umbrella -->
  <g clip-path="url(#hlCanopy)">
    <rect x="30" y="30" width="110" height="150" fill="#FF6B6B"/>
    <rect x="140" y="30" width="100" height="150" fill="#FFC93C"/>
    <rect x="240" y="30" width="100" height="150" fill="#4ECDC4"/>
    <rect x="340" y="30" width="120" height="150" fill="#1E293B"/>
