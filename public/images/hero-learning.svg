  <path d="M240 38v20" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
  <circle cx="240" cy="34" r="8" fill="#1E293B"/>
  <path d="M236 150h9v122h-9z" fill="#B07642"/>
  <path d="M240 272c0 20-12 30-28 30-12 0-18-7-18-16" fill="none" stroke="#B07642" stroke-width="9" stroke-linecap="round"/>

  <!-- ground -->
