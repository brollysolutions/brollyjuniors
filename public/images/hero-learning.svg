    <circle cx="144" cy="288" r="3" fill="#1E293B"/><circle cx="160" cy="288" r="3" fill="#1E293B"/>
    <path d="M145 298c4 5 10 5 14 0" stroke="#1E293B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M118 340h68l-34-16Z" fill="#FFFFFF" stroke="#E2D9BD" stroke-width="2"/>
    <path d="M152 324v16" stroke="#E2D9BD" stroke-width="2"/>
  </g>

  <!-- child middle -->
  <g>
    <path d="M198 358c0-36 20-58 46-58s46 22 46 58Z" fill="#FFC93C"/>
    <circle cx="244" cy="274" r="29" fill="#EBB183"/>
    <path d="M215 272c0-20 13-34 29-34s29 14 29 34c-6-12-16-16-29-16s-23 4-29 16Z" fill="#20160F"/>
