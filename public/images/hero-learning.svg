    <path d="M236 288c5 6 12 6 17 0" stroke="#1E293B" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <rect x="222" y="326" width="44" height="30" rx="5" fill="#FFFFFF" stroke="#E2D9BD" stroke-width="2"/>
    <path d="M230 336h28M230 344h20" stroke="#FFC93C" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- child right -->
