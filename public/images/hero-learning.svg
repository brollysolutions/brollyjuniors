    <path d="M294 358c0-32 18-52 42-52s42 20 42 52Z" fill="#FF6B6B"/>
    <circle cx="336" cy="286" r="26" fill="#C98B5E"/>
    <path d="M310 284c2-20 14-32 26-32s24 12 26 32c-6-6-14-14-26-14s-20 8-26 14Z" fill="#2B1D12"/>
    <circle cx="328" cy="288" r="3" fill="#1E293B"/><circle cx="344" cy="288" r="3" fill="#1E293B"/>
    <path d="M329 298c4 5 10 5 14 0" stroke="#1E293B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
