    <path d="M-18-46 -6-14h12l12-32" fill="none" stroke="#FF6B6B" stroke-width="8" stroke-linecap="round"/>
    <circle cx="0" cy="10" r="26" fill="#FFC93C" stroke="#1E293B" stroke-width="5"/>
    <path d="M0-6 5 4h11l-9 7 4 11-11-7-11 7 4-11-9-7h11Z" fill="#1E293B"/>
