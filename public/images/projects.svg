<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="A student project showcase with a rocket, chart and prototype cards">
  <defs>
    <linearGradient id="prBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#FBEFD0"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" rx="28" fill="url(#prBg)"/>
  <circle cx="62" cy="76" r="40" fill="#FFD4D4" opacity=".6"/>
  <circle cx="416" cy="296" r="42" fill="#C5F1ED" opacity=".65"/>

  <!-- rocket -->
  <g transform="translate(148 158)">
    <path d="M0-96c30 26 44 62 44 100l-16 22H-28l-16-22c0-38 14-74 44-100Z" fill="#FFFFFF" stroke="#4ECDC4" stroke-width="6"/>
    <circle cx="0" cy="-24" r="20" fill="#C5F1ED" stroke="#4ECDC4" stroke-width="5"/>
    <path d="M-44 24-70 62l30-8Z" fill="#FF6B6B"/>
    <path d="M44 24 70 62l-30-8Z" fill="#FF6B6B"/>
    <path d="M-14 26h28l-6 26h-16Z" fill="#FFC93C"/>
    <path d="M0 56c10 12 10 30 0 42-10-12-10-30 0-42Z" fill="#FFC93C"/>
  </g>

  <!-- chart card -->
  <g transform="translate(342 132)">
    <rect x="-88" y="-70" width="176" height="130" rx="18" fill="#FFFFFF" stroke="#E2D9BD" stroke-width="4"/>
    <rect x="-66" y="-48" width="70" height="12" rx="6" fill="#FBEFD0"/>
    <g>
      <rect x="-66" y="6" width="24" height="38" rx="6" fill="#FFC93C"/>
      <rect x="-30" y="-14" width="24" height="58" rx="6" fill="#4ECDC4"/>
      <rect x="6" y="18" width="24" height="26" rx="6" fill="#FF6B6B"/>
      <rect x="42" y="-30" width="24" height="74" rx="6" fill="#1E293B"/>
    </g>
  </g>

  <!-- prototype cards -->
  <g transform="translate(264 274)">
    <g transform="rotate(-6)">
      <rect x="-98" y="-42" width="112" height="84" rx="16" fill="#FFFFFF" stroke="#E2D9BD" stroke-width="4"/>
      <circle cx="-70" cy="-14" r="12" fill="#C5F1ED" stroke="#4ECDC4" stroke-width="3"/>
      <path d="M-50 -18h44M-84 8h72M-84 24h48" stroke="#E2D9BD" stroke-width="7" stroke-linecap="round"/>
