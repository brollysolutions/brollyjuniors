<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="A numbered list shelf with items in slots zero to three">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#FBEFD0"/></linearGradient></defs>
  <rect width="480" height="360" rx="28" fill="url(#bg)"/>

  <circle cx="60" cy="70" r="36" fill="#FFD4D4" opacity=".7"/>
  <circle cx="424" cy="294" r="40" fill="#C5F1ED" opacity=".65"/>
  <g transform="translate(240 176)">
    <rect x="-190" y="-56" width="380" height="112" rx="22" fill="#FFFFFF" stroke="#1E293B" stroke-width="4"/>
    <g>
      <rect x="-172" y="-32" width="82" height="64" rx="12" fill="#FFE9A3"/>
      <text x="-131" y="-8" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1E293B">0</text>
      <circle cx="-131" cy="14" r="12" fill="#FFC93C"/>
    </g>
    <g>
      <rect x="-80" y="-32" width="82" height="64" rx="12" fill="#C5F1ED"/>
      <text x="-39" y="-8" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1E293B">1</text>
      <circle cx="-39" cy="14" r="12" fill="#4ECDC4"/>
    </g>
    <g>
      <rect x="12" y="-32" width="82" height="64" rx="12" fill="#FFD4D4"/>
      <text x="53" y="-8" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1E293B">2</text>
      <circle cx="53" cy="14" r="12" fill="#FF6B6B"/>
    </g>
    <g>
      <rect x="104" y="-32" width="82" height="64" rx="12" fill="#DCD0FB"/>
      <text x="145" y="-8" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1E293B">3</text>
      <circle cx="145" cy="14" r="12" fill="#A78BFA"/>
    </g>
  </g>
  <g transform="translate(240 288)">
    <rect x="-116" y="-24" width="232" height="48" rx="16" fill="#1E293B"/>
    <text x="-96" y="8" font-family="Consolas, Menlo, monospace" font-size="17" fill="#C5F1ED">scores[</text>
    <text x="-24" y="8" font-family="Consolas, Menlo, monospace" font-size="17" fill="#FFC93C">2</text>
    <text x="-10" y="8" font-family="Consolas, Menlo, monospace" font-size="17" fill="#C5F1ED">] = 90</text>
  </g>
</svg>
