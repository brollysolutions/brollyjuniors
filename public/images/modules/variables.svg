<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Three labelled boxes holding a name, a number and a score">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#FBEFD0"/></linearGradient></defs>
  <rect width="480" height="360" rx="28" fill="url(#bg)"/>

  <circle cx="60" cy="286" r="40" fill="#DCD0FB" opacity=".7"/>
  <circle cx="424" cy="66" r="36" fill="#FFD4D4" opacity=".7"/>
  <g transform="translate(240 172)">
    <g transform="translate(-118 0)">
      <rect x="-52" y="-46" width="104" height="92" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="4"/>
      <rect x="-52" y="-46" width="104" height="26" rx="13" fill="#FFC93C"/>
      <rect x="-52" y="-33" width="104" height="13" fill="#FFC93C"/>
      <text x="0" y="-27" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1E293B">name</text>
      <text x="0" y="22" text-anchor="middle" font-family="Fredoka, Poppins, sans-serif" font-weight="600" font-size="20" fill="#2B6CB0">"Meera"</text>
    </g>
    <g transform="translate(0 0)">
      <rect x="-52" y="-46" width="104" height="92" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="4"/>
      <rect x="-52" y="-46" width="104" height="26" rx="13" fill="#4ECDC4"/>
      <rect x="-52" y="-33" width="104" height="13" fill="#4ECDC4"/>
      <text x="0" y="-27" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1E293B">age</text>
      <text x="0" y="24" text-anchor="middle" font-family="Fredoka, Poppins, sans-serif" font-weight="600" font-size="26" fill="#2B6CB0">12</text>
    </g>
    <g transform="translate(118 0)">
      <rect x="-52" y="-46" width="104" height="92" rx="16" fill="#FFFFFF" stroke="#1E293B" stroke-width="4"/>
      <rect x="-52" y="-46" width="104" height="26" rx="13" fill="#FF6B6B"/>
      <rect x="-52" y="-33" width="104" height="13" fill="#FF6B6B"/>
      <text x="0" y="-27" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1E293B">score</text>
      <text x="0" y="24" text-anchor="middle" font-family="Fredoka, Poppins, sans-serif" font-weight="600" font-size="26" fill="#2B6CB0">99</text>
    </g>
  </g>
  <g transform="translate(240 282)">
    <rect x="-140" y="-24" width="280" height="48" rx="16" fill="#1E293B"/>
    <text x="-118" y="8" font-family="Consolas, Menlo, monospace" font-size="17" fill="#C5F1ED">score = input(</text>
    <text x="26" y="8" font-family="Consolas, Menlo, monospace" font-size="17" fill="#FFC93C">"?"</text>
    <text x="60" y="8" font-family="Consolas, Menlo, monospace" font-size="17" fill="#C5F1ED">)</text>
  </g>
</svg>
