<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Phonics letter blocks, sound bubbles and a child sounding out words">
  <defs>
    <linearGradient id="phBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/><stop offset="1" stop-color="#FBEFD0"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" rx="28" fill="url(#phBg)"/>
  <circle cx="60" cy="58" r="40" fill="#FFD4D4" opacity=".65"/>
  <circle cx="424" cy="82" r="30" fill="#C5F1ED" opacity=".7"/>
  <circle cx="410" cy="300" r="46" fill="#FFE9A3" opacity=".7"/>

  <!-- letter blocks -->
  <g font-family="Fredoka, Poppins, sans-serif" font-weight="700" text-anchor="middle">
    <g transform="rotate(-8 92 168)">
      <rect x="52" y="128" width="80" height="80" rx="16" fill="#FFC93C" stroke="#1E293B" stroke-width="4"/>
      <text x="92" y="182" font-size="46" fill="#FFF8E7">Aa</text>
    </g>
    <g transform="rotate(5 176 196)">
      <rect x="136" y="156" width="80" height="80" rx="16" fill="#4ECDC4" stroke="#1E293B" stroke-width="4"/>
      <text x="176" y="210" font-size="46" fill="#C5F1ED">Ss</text>
    </g>
    <g transform="rotate(-4 262 172)">
      <rect x="222" y="132" width="80" height="80" rx="16" fill="#FF6B6B" stroke="#1E293B" stroke-width="4"/>
      <text x="262" y="186" font-size="46" fill="#FFF8E7">Tt</text>
    </g>
  </g>

  <!-- blending arrow -->
  <path d="M70 250c60 34 190 34 250 2" fill="none" stroke="#1E293B" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>
  <path d="M312 244l16 8-16 10Z" fill="#1E293B"/>
  <text x="196" y="292" font-family="Fredoka, Poppins, sans-serif" font-weight="700" font-size="30" text-anchor="middle" fill="#1E293B">s · a · t</text>

  <!-- child sounding out -->
  <g transform="translate(352 128)">
    <circle cx="0" cy="0" r="46" fill="#FFFFFF" stroke="#E2D9BD" stroke-width="3"/>
    <circle cx="0" cy="4" r="34" fill="#F6C89A"/>
    <path d="M-34 0c0-22 15-36 34-36s34 14 34 36c-10-12-20-16-34-16s-24 4-34 16Z" fill="#3B2E22"/>
    <circle cx="-12" cy="4" r="4" fill="#1E293B"/><circle cx="12" cy="4" r="4" fill="#1E293B"/>
    <ellipse cx="0" cy="22" rx="9" ry="11" fill="#C2410C"/>
    <path d="M52 -14c10 6 10 22 0 28M64 -26c18 12 18 46 0 58" fill="none" stroke="#4ECDC4" stroke-width="5" stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- digraph bubbles -->
  <g font-family="Fredoka, Poppins, sans-serif" font-weight="700" font-size="22" text-anchor="middle">
    <g>
      <rect x="330" y="220" width="76" height="48" rx="20" fill="#FFFFFF" stroke="#E2D9BD" stroke-width="3"/>
      <path d="M352 268l-4 16 18-16Z" fill="#FFFFFF" stroke="#E2D9BD" stroke-width="3"/>
      <text x="368" y="252" fill="#4ECDC4">sh</text>
    </g>
    <g>
      <rect x="34" y="256" width="70" height="44" rx="18" fill="#FFFFFF" stroke="#E2D9BD" stroke-width="3"/>
      <path d="M82 300l6 16-20-16Z" fill="#FFFFFF" stroke="#E2D9BD" stroke-width="3"/>
      <text x="69" y="286" fill="#FF6B6B">ch</text>
    </g>
  </g>
</svg>
