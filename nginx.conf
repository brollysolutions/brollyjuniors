# ============================================================================
# Brolly Juniors — nginx (Docker runtime, see Dockerfile)
#
# WHY THIS FILE IS LONG
#
# The site used to be served by Apache/LiteSpeed on shared hosting, where
# public/.htaccess did the canonicalisation, the legacy 301s and the real 404s.
# nginx ignores .htaccess completely, so when the deployment moved to this
# container every one of those protections silently stopped existing. Measured
# on the live site before this file was rewritten:
#
#   /junior-skills/abacus                  301 -> /junior-skills/abacus/
#   /abacus-classes-in-hyderabad.html      200  (served the home page)
#   /programs/abacus-classes-hyderabad     200  (served the home page)
#   /this-page-does-not-exist              200  (served the home page, indexable)
#   https://www.brollyjuniors.com/         200  (duplicate of all 204 pages)
#
# That is three separate SEO faults at once: every canonical URL in the sitemap
# answered with a redirect rather than the page, every legacy URL threw away
# its accumulated authority, and every mistyped URL became a soft 404 that
# Google counts against the whole site.
#
# The rules below are a port of public/.htaccess. Keep the two in sync — the
# .htaccess is retained because it is what an Apache host would need, and it
# documents the same decisions.
# ============================================================================

# --- Canonical host: www -> non-www -------------------------------------------
# Depends on the front proxy passing the original Host header
# (proxy_set_header Host $host). If it does not, this block never matches and
# the canonical tag remains the only www signal — see docs/DEPLOYMENT.md.
server {
    listen 3300;
    listen [::]:3300;
    server_name www.brollyjuniors.com;
    return 301 https://brollyjuniors.com$request_uri;
}

server {
    listen 3300 default_server;
    listen [::]:3300 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind a TLS-terminating proxy nginx only ever sees http://, so any
    # redirect it builds itself would name the wrong scheme. Emitting a
    # path-only Location keeps the browser on https.
    absolute_redirect off;

    # http -> https is handled by the front proxy and already works in
    # production. Do NOT add a scheme redirect here: this server receives
    # plain HTTP from that proxy, so it would redirect to itself forever.

    # ------------------------------------------------------------------
    # Compression
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ------------------------------------------------------------------
    # Security / privacy headers (mirrors the .htaccess tail)
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------------------------------
    # 0. One URL per page: strip the trailing slash.
    #
    #    Section 5 serves /programs/index.html for a request to /programs
    #    without redirecting — but it does the same for /programs/, so every
    #    page was reachable at two URLs, both answering 200. The canonical tag
    #    names the slash-free form, and canonicals are a hint, not a rule:
    #    Semrush shows Google had indexed the *slashed* variant of
    #    /resources/cbse-ai-curriculum-class-9-explained/ in preference to the
    #    canonical one. A 301 removes the choice.
    #
    #    `^(/.+)/$` cannot match "/" itself — the root keeps its slash.
    # ------------------------------------------------------------------
    rewrite ^(/.+)/$ $1 permanent;

    # ------------------------------------------------------------------
    # 1. Legacy URLs from the WordPress / static-HTML site.
    #
    #    These are the URLs Google still has in its index. Without a 301 they
    #    served a 200 copy of the home page, which both loses the link equity
    #    and creates a duplicate. Drop a rule only once the old URL has fallen
    #    out of the Search Console coverage report.
    # ------------------------------------------------------------------
    rewrite ^/index\.html$                                    /                                permanent;

    # AI + Python hubs and per-class curricula
    rewrite ^/ai-classes-for-kids-in-hyderabad\.html$         /ai-for-kids                     permanent;
    rewrite ^/python-classes-for-kids-in-hyderabad\.html$     /python-for-kids                 permanent;
    rewrite ^/ai-curriculum-class-([6-9]|10)-hyderabad\.html$      /ai-for-kids/class-$1       permanent;
    rewrite ^/python-curriculum-class-([6-9]|10)-hyderabad\.html$  /python-for-kids/class-$1   permanent;

    # Retired combined "AI & Python" pages
    rewrite ^/ai-python-course-for-class-([6-9]|10)-hyderabad\.html$ /python-for-kids/class-$1 permanent;
    rewrite ^/ai-python-classes-for-kids-in-hyderabad\.html$  /                                permanent;

    # Junior skills
    rewrite ^/abacus-classes-in-hyderabad\.html$              /junior-skills/abacus            permanent;
    rewrite ^/vedic-maths-classes-in-hyderabad\.html$         /junior-skills/vedic-maths       permanent;
    rewrite ^/public-speaking-classes-1-5-hyderabad\.html$    /junior-skills/public-speaking   permanent;
    rewrite ^/digital-literacy-classes-for-kids-hyderabad\.html$ /junior-skills/digital-literacy permanent;

    # Class 1-5 curriculum pages -> junior skills hub (no 1:1 successor)
    rewrite ^/class-[1-5]-curriculum-hyderabad\.html$         /junior-skills                   permanent;
    rewrite ^/classes-1-to-5-curriculum-hyderabad\.html$      /junior-skills                   permanent;

    # Schools
    rewrite ^/schools-hyderabad\.html$                        /schools                             permanent;
    rewrite ^/schools-partnership-program-hyderabad\.html$    /schools/school-partnership-program  permanent;
    rewrite ^/schools-annual-academic-program-hyderabad\.html$ /schools/annual-academic-program    permanent;
    rewrite ^/schools-request-proposal\.html$                 /schools/request-proposal            permanent;
    rewrite ^/schools-ai-curriculum-hyderabad\.html$          /schools/ai-curriculum               permanent;
    rewrite ^/schools-python-curriculum-hyderabad\.html$      /schools/python-curriculum           permanent;
    rewrite ^/schools-ai-coding-clubs-hyderabad\.html$        /schools/ai-and-coding-clubs         permanent;
    rewrite ^/schools-teacher-training-hyderabad\.html$       /schools/teacher-training            permanent;

    # Company / content. The About page was retired; its story is on the home page.
    rewrite ^/about\.html$                                    /                permanent;
    rewrite ^/about/?$                                        /                permanent;
    rewrite ^/contact\.html$                                  /contact         permanent;
    rewrite ^/book-free-demo\.html$                           /book-free-demo  permanent;
    rewrite ^/student-projects\.html$                         /student-projects permanent;
    rewrite ^/resources\.html$                                /resources       permanent;
    rewrite ^/academics/?$                                    /programs        permanent;
    rewrite ^/activities/?$                                   /junior-skills   permanent;

    # Retired /programs/<slug> structure — see section 3a below. These rules
    # cannot live here in the server block: a `rewrite` at this level runs
    # before try_files, so it would redirect away a /programs/<slug> page that
    # genuinely exists. That is not hypothetical — it is what happened when the
    # programme catalogue was added, and it 301'd all 24 of its pages.

    # ------------------------------------------------------------------
    # 2. Content-hashed build assets — safe to cache forever.
    #    Vite emits index-BhsITwUB.js; the hash makes the name unique per
    #    build, so a stale copy can never be served after a deploy.
    # ------------------------------------------------------------------
    #
    #    nginx only inherits add_header from an outer level when the current
    #    level declares none of its own, so every location that sets a header
    #    has to restate the two security headers. That is why they repeat.
    location ~ "^/assets/.+-[0-9A-Za-z_-]{8,}\.(?:js|mjs|css|woff2?|png|jpe?g|gif|svg|webp|avif)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # 3. Everything else static. These filenames are NOT hashed — an updated
    #    logo or share card keeps its name — so a one-year immutable cache
    #    would pin the old file in every returning visitor's browser. A week
    #    is long enough to help and short enough to fix a mistake.
    # ------------------------------------------------------------------
    location ~* \.(?:jpg|jpeg|gif|png|svg|ico|webp|avif|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        try_files $uri =404;
    }

    # Crawler-facing files must never be served from a stale cache: a sitemap
    # cached for a week is a week of new pages Google is not told about.
    location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # 3a. Retired /programs/<slug> URLs, as a fallback only.
    #
    #     The old WordPress slugs were inconsistent ("abacus-classes-hyderabad",
    #     "ai-classes-for-kids-hyderabad"), so they are matched on a keyword
    #     prefix. That prefix matching is broad enough to also match the real
    #     catalogue pages (/programs/coding, /programs/chess, …), which is why
    #     these run *after* try_files rather than as server-level rewrites:
    #     a prerendered page wins, and only a slug with no page of its own
    #     reaches @programs_legacy. Adding a programme page can therefore no
    #     longer be silently shadowed by a redirect.
    #
    #     scripts/audit-seo.mjs enforces this invariant at build time.
    # ------------------------------------------------------------------
    location ^~ /programs/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/index.html @programs_legacy;
    }

    location @programs_legacy {
        rewrite ^/programs/abacus[^/]*$              /junior-skills/abacus           permanent;
        rewrite ^/programs/phonics[^/]*$             /junior-skills/phonics          permanent;
        rewrite ^/programs/vedic[^/]*$               /junior-skills/vedic-maths      permanent;
        rewrite ^/programs/public-speaking[^/]*$     /junior-skills/public-speaking  permanent;
        rewrite ^/programs/(digital|creative)[^/]*$  /junior-skills/digital-literacy permanent;
        rewrite ^/programs/ai[^/]*$                  /ai-for-kids                    permanent;
        rewrite ^/programs/(python|coding)[^/]*$     /python-for-kids                permanent;
        rewrite ^/programs/.+$                       /programs                       permanent;
        return 404;
    }

    # ------------------------------------------------------------------
    # 4. Module URLs keep the client-side fallback.
    #    A shortened or older module link (…/class-6/module-3-old-slug) has no
    #    prerendered file, but React Router resolves it from the slug prefix,
    #    so it must reach the app shell rather than 404. Matches the exception
    #    in .htaccess rule 5.
    # ------------------------------------------------------------------
    location ~ ^/(ai|python)-for-kids/class-[0-9]+/. {
        try_files $uri $uri/index.html /index.html;
    }

    # ------------------------------------------------------------------
    # 5. Prerendered pages, served WITHOUT a trailing-slash redirect.
    #
    #    `$uri/index.html` rather than nginx's usual `$uri/`: the latter makes
    #    nginx notice the directory and 301 to the slashed URL first, which is
    #    exactly the redirect that made every canonical URL in the sitemap
    #    answer 301 instead of 200. A bare `$uri` that resolves to a directory
    #    is skipped by try_files, so /programs falls straight through to
    #    /programs/index.html and is served in one hop.
    #
    #    =404 rather than a /index.html fallback: answering 200 with the home
    #    page for every unknown URL is a soft 404, and a site full of them is
    #    one Google stops trusting.
    # ------------------------------------------------------------------
    #    The cache headers live here rather than in a `location ~ \.html$`,
    #    because try_files serves /programs/index.html from inside this block
    #    without re-running location matching — an .html location would only
    #    ever have caught a direct request for the file, which nothing makes.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/index.html =404;
    }

    # The prerendered 404 carries <meta name="robots" content="noindex">, so a
    # mistyped URL is both correctly statused and safely unindexable.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Dotfiles (.htaccess included) are never served.
    location ~ /\. {
        deny all;
    }
}
